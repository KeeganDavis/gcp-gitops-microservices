replicaCount: 1

image:
  repository: us-central1-docker.pkg.dev/gcp-gitops-microservices/capstone-docker-repo/python-api
  tag: 3d9e1b9
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  staticIpName: "python-api-global-ip"

env:
  otelEndpoint: "http://otel-collector.monitoring.svc.cluster.local:4317"
  otelServiceName: "python-api-gke"
  OTEL_PYTHON_EXCLUDED_URLS: "health,.*/$"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50