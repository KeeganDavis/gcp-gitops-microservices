{{- if .Values.chaos.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-monkey-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaos-monkey-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos-monkey-binding
subjects:
  - kind: ServiceAccount
    name: chaos-monkey-sa
roleRef:
  kind: Role
  name: chaos-monkey-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}