services:
  python-api:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - gitops-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  go-cli:
    build:
      context: ./cli
      dockerfile: Dockerfile
    profiles:
      - tools
    environment:
      - API_URL=http://python-api:8000
    networks:
      - gitops-net

networks:
  gitops-net:
    driver: bridge